# nginx for the HustleHub+ client container (nginx-unprivileged, port 8080).
#
# - Serves the built React app with the same security headers as
#   `npm run preview`. They're generated from securityHeaders.js into
#   snippets/security-headers.conf when the image is built.
# - Proxies /api to the api container over HTTPS and VERIFIES the api's
#   certificate against the shared self-signed cert (SAN includes "api").
#
# nginx only inherits add_header from the server level when a location has
# none of its own, so every location that serves files includes the
# snippet itself.

server {
    listen 8080;
    server_name _;
    server_tokens off;

    root /usr/share/nginx/html;
    index index.html;

    # The api caps bodies at 10kb; refuse anything much bigger up front.
    client_max_body_size 16k;

    # Docker's embedded DNS, so a restarted api container (new IP) is found
    # again instead of nginx holding on to the old address.
    resolver 127.0.0.11 valid=10s ipv6=off;

    # Container healthcheck. Not logged.
    location = /healthz {
        include /etc/nginx/snippets/security-headers.conf;
        access_log off;
        default_type text/plain;
        return 200 "ok\n";
    }

    # ---- API ----
    # The api sends its own Helmet headers, so none are added here.
    location /api/ {
        set $api_upstream https://api:5000;
        proxy_pass $api_upstream;
        proxy_http_version 1.1;

        # A fixed Host (the api's own name, as in its certificate) instead of
        # the client's Host header, so an attacker-chosen Host value can never
        # reach the api (host header injection).
        proxy_set_header Host api;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        proxy_ssl_verify on;
        proxy_ssl_trusted_certificate /etc/nginx/certs/cert.pem;
        proxy_ssl_name api;
        proxy_ssl_server_name on;
        proxy_ssl_verify_depth 2;
        proxy_ssl_protocols TLSv1.2 TLSv1.3;

        proxy_connect_timeout 5s;
        proxy_read_timeout 30s;
    }

    # ---- Hashed build assets (index-AbC123.js): cache for a year ----
    location /assets/ {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
        try_files $uri =404;
    }

    # ---- Everything else: the SPA. Unknown paths get index.html so React
    # Router can handle them. Never cached, so a new build shows up at once.
    location / {
        include /etc/nginx/snippets/security-headers.conf;
        add_header Cache-Control "no-cache" always;
        try_files $uri $uri/ /index.html;
    }
}
