# ===================================================================
#  TEST ONLY. Never use this file for a real deployment.
# ===================================================================
#
# Layered on top of docker-compose.yml so the main Newman collection can
# run against the containers (locally and in the pipeline):
#
#   docker compose -f docker-compose.yml -f docker-compose.test.yml up -d --build
#   npx newman run api/postman/HustleHub_API.postman_collection.json \
#     --insecure --env-var base_url=https://localhost:5000
#
# If port 5000 is taken (for example by `npm run dev`), set API_TEST_PORT=5001
# before `up` and use base_url=https://localhost:5001.
#
# What it changes, and why:
#   - Publishes the API on 127.0.0.1:5000 (loopback only, never 0.0.0.0),
#     because the collection calls the API directly. With TRUST_PROXY=1 a
#     direct caller could fake X-Forwarded-For, which is acceptable only for
#     a local test run. That's why the default file doesn't publish it.
#   - Applies the same relaxed rate limits as `npm run start:test`: the
#     collection registers and logs in far more often than the strict
#     limits allow.
#   - Sets NODE_ENV=test. The API IGNORES the RATE_LIMIT_*_MAX overrides when
#     NODE_ENV is production (so a deployment can't be relaxed by mistake),
#     so the relaxed limits only work with a non-production NODE_ENV. The
#     only other effects of not being in production: unexpected errors log
#     their stack trace to the server log (never to the client), the
#     JWT_SECRET length check is skipped, and `clean:test` is allowed to run.

services:
  api:
    ports:
      # Change the host port with API_TEST_PORT if 5000 is already in use.
      - "127.0.0.1:${API_TEST_PORT:-5000}:5000"
    environment:
      NODE_ENV: test
      RATE_LIMIT_LOGIN_MAX: "10000"
      RATE_LIMIT_REGISTER_MAX: "10000"
      RATE_LIMIT_BOOKING_MAX: "10000"
      RATE_LIMIT_GENERAL_MAX: "10000"
