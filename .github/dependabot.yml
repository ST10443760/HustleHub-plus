# Weekly dependency updates. Every Dependabot pull request runs the full CI
# pipeline, so an update only lands if tests, audits and scans still pass.
# Minor and patch updates are grouped per folder to keep the number of open
# pull requests small. Major versions are ignored for npm and Docker images.

version: 2

updates:
  - package-ecosystem: npm
    directory: /api
    schedule:
      interval: weekly
    # The stack is pinned on purpose (Node 22, Express 4, MongoDB 8 ...), so
    # major versions are not proposed. Minor, patch and security updates are.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    groups:
      api-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: npm
    directory: /client
    schedule:
      interval: weekly
    # The stack is pinned on purpose (Node 22, Express 4, MongoDB 8 ...), so
    # major versions are not proposed. Minor, patch and security updates are.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
    groups:
      client-minor-and-patch:
        update-types: [minor, patch]

  # Keeps the SHA-pinned actions in .github/workflows up to date (Dependabot
  # updates the SHA and the version comment together).
  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
    open-pull-requests-limit: 3
    groups:
      actions:
        patterns: ["*"]

  # Base images in the three Dockerfiles.
  - package-ecosystem: docker
    directories:
      - /api
      - /client
      - /docker/certs
    schedule:
      interval: weekly
    # The stack is pinned on purpose (Node 22, Express 4, MongoDB 8 ...), so
    # major versions are not proposed. Minor, patch and security updates are.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3

  # The mongo image in docker-compose.yml.
  - package-ecosystem: docker-compose
    directory: /
    schedule:
      interval: weekly
    # The stack is pinned on purpose (Node 22, Express 4, MongoDB 8 ...), so
    # major versions are not proposed. Minor, patch and security updates are.
    ignore:
      - dependency-name: "*"
        update-types: ["version-update:semver-major"]
    open-pull-requests-limit: 3
